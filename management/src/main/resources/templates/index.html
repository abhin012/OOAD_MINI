<!DOCTYPE html>
<html>
<head>
    <title>VAKA HOTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --gold: #C9A84C; --gold-light: #E8C97A; --bg: #0A0A0A; --bg2: #141414; --text: #F0EDE8; --muted: #8A8680; --border: rgba(201,168,76,0.2); }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.06) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.04) 0%, transparent 50%); pointer-events: none; }
        .logo-area { text-align: center; margin-bottom: 60px; animation: fadeDown 0.8s ease both; }
        .logo-line { width: 1px; height: 60px; background: linear-gradient(to bottom, transparent, var(--gold), transparent); margin: 0 auto 24px; }
        .hotel-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(48px, 8vw, 80px); font-weight: 300; letter-spacing: 0.3em; color: var(--text); line-height: 1; }
        .hotel-tagline { font-size: 11px; letter-spacing: 0.4em; color: var(--gold); text-transform: uppercase; margin-top: 12px; }
        .divider { display: flex; align-items: center; gap: 16px; margin-bottom: 56px; animation: fadeUp 0.8s 0.2s ease both; }
        .divider-line { flex: 1; height: 1px; background: var(--border); max-width: 80px; }
        .divider-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
        .divider-text { font-size: 10px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
        .btn-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; animation: fadeUp 0.8s 0.4s ease both; }
        .btn { display: flex; align-items: center; gap: 10px; padding: 14px 32px; font-family: 'DM Sans', sans-serif; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; cursor: pointer; border: none; transition: all 0.3s ease; }
        .btn-primary { background: var(--gold); color: #0A0A0A; font-weight: 500; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
        .btn svg { width: 16px; height: 16px; }
        .footer-text { position: fixed; bottom: 32px; font-size: 10px; letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; }
        @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }
        @keyframes fadeUp   { from { opacity:0; transform: translateY(20px);  } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="logo-area">
        <div class="logo-line"></div>
        <div class="hotel-name">VAKA</div>
        <div class="hotel-tagline">Hotel &amp; Residences</div>
    </div>
    <div class="divider">
        <div class="divider-line"></div><div class="divider-diamond"></div>
        <div class="divider-text">Welcome</div>
        <div class="divider-diamond"></div><div class="divider-line"></div>
    </div>
    <div class="btn-group">
        <a href="/guest/login" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Guest Login
        </a>
        <a href="/guest/register" class="btn btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            New Guest
        </a>
        <a href="/employee/login" class="btn btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Staff Login
        </a>
    </div>
    <div class="footer-text">Bengaluru &nbsp;·&nbsp; Est. 2026</div>
</body>
</html>
