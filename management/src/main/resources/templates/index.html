<!DOCTYPE html>
<html>
<head>
    <title>Grand Palace Hotel</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 80px; background: #f5f5f5; }
        h1 { color: #2c3e50; font-size: 2.5em; }
        p { color: #666; font-size: 1.1em; }
        .btn { display: inline-block; margin: 10px; padding: 12px 30px;
               background: #2c3e50; color: white; text-decoration: none;
               border-radius: 5px; font-size: 1em; }
        .btn:hover { background: #34495e; }
        .btn-outline { background: white; color: #2c3e50; border: 2px solid #2c3e50; }
    </style>
</head>
<body>
    <h1>Grand Palace Hotel</h1>
    <p>Welcome — please choose how to continue</p>
    <br>
    <a href="/guest/login" class="btn">Guest Login</a>
    <a href="/guest/register" class="btn btn-outline">New Guest</a>
    <a href="/employee/login" class="btn">Employee Login</a>
</body>
</html>
