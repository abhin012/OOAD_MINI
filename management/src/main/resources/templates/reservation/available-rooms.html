<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Available Rooms — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--text2:#B8B4AE;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--green:#4CAF7C;--radius:4px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:48px 40px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:40px;transition:color 0.2s}
.back:hover{color:var(--gold)}
.back svg{width:14px;height:14px}
.title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;letter-spacing:0.08em;margin-bottom:8px}
.subtitle{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.room-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:28px;transition:all 0.25s;position:relative;overflow:hidden}
.room-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--gold),transparent);opacity:0;transition:opacity 0.25s}
.room-card:hover{border-color:var(--border);transform:translateY(-2px)}
.room-card:hover::before{opacity:1}
.room-number{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;color:var(--gold);line-height:1;margin-bottom:4px}
.room-type{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);margin-bottom:20px}
.room-meta{display:flex;gap:24px;margin-bottom:24px}
.meta-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.meta-item svg{width:13px;height:13px;color:var(--gold);flex-shrink:0}
.room-price{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--text);margin-bottom:20px}
.room-price span{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
.badge-avail{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(76,175,124,0.1);border:1px solid rgba(76,175,124,0.25);color:var(--green);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;border-radius:2px;margin-bottom:20px}
.badge-avail::before{content:'';width:5px;height:5px;background:var(--green);border-radius:50%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;text-decoration:none;border-radius:var(--radius);transition:background 0.2s}
.btn:hover{background:var(--gold-light)}
.btn svg{width:13px;height:13px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty svg{width:48px;height:48px;margin:0 auto 16px;display:block;opacity:0.3}
</style>
</head>
<body>
<a class="back" href="/guest/dashboard">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  Dashboard
</a>
<div class="title">Available Rooms</div>
<div class="subtitle">Select a room to begin your reservation</div>

<div th:if="${rooms.empty}" class="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  <p>No rooms available at the moment.</p>
</div>

<div class="rooms-grid" th:unless="${rooms.empty}">
  <div class="room-card" th:each="room : ${rooms}">
    <div class="room-number" th:text="${room.roomNumber}"></div>
    <div class="room-type" th:text="${room.roomType}"></div>
    <div class="room-meta">
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 3 21 3 21 7"/><path d="M3 10a9 9 0 0 1 15.5-6.2L21 7"/><polyline points="7 21 3 21 3 17"/><path d="M21 14a9 9 0 0 1-15.5 6.2L3 17"/></svg>
        Floor <span th:text="${room.floor}"></span>
      </div>
    </div>
    <div class="badge-avail">Available</div>
    <div class="room-price">Rs. <span th:text="${room.pricePerNight}"></span> <span>/ night</span></div>
    <a href="/reservations/book" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Book This Room
    </a>
  </div>
</div>
</body>
</html>
