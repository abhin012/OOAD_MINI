<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Available Rooms</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; }
        h2 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        a { color: #2c3e50; }
        .btn { background: #2c3e50; color: white; padding: 6px 16px; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Available Rooms</h2>
    <table>
        <tr>
            <th>Room No.</th><th>Floor</th><th>Type</th><th>Price/Night</th><th>Status</th><th>Action</th>
        </tr>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.floor}"></td>
            <td th:text="${room.roomType}"></td>
            <td th:text="'Rs. ' + ${room.pricePerNight}"></td>
            <td th:text="${room.status}"></td>
            <td><a th:href="@{/reservations/book}" class="btn">Book</a></td>
        </tr>
    </table>
    <br><a href="/guest/dashboard">Back to Dashboard</a>
</body>
</html>
