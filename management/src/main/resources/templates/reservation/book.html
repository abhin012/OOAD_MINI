<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Book a Room — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--text2:#B8B4AE;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--red:#E05555;--green:#4CAF7C;--radius:4px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.wrap{width:100%;max-width:460px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:36px;transition:color 0.2s}
.back:hover{color:var(--gold)}
.back svg{width:14px;height:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:40px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:0.08em;margin-bottom:8px}
.card-sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
.gold-line{height:1px;background:linear-gradient(to right,var(--gold),transparent);margin:0 0 32px}
label{display:block;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
select,input{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;border-radius:var(--radius);outline:none;transition:border-color 0.2s;margin-bottom:20px}
select:focus,input:focus{border-color:var(--gold)}
select option{background:var(--bg3)}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.6)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.nights-display{padding:10px 16px;border-radius:var(--radius);margin-bottom:20px;font-size:13px;display:none;align-items:center;gap:8px}
.nights-display svg{width:14px;height:14px;flex-shrink:0}
.nights-ok{background:rgba(76,175,124,0.1);border:1px solid rgba(76,175,124,0.25);color:var(--green);display:flex}
.nights-err{background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.25);color:var(--red);display:flex}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;border:none;border-radius:var(--radius);cursor:pointer;transition:background 0.2s;margin-top:4px}
.btn:hover{background:var(--gold-light)}
.btn svg{width:15px;height:15px}
.alert-err{padding:12px 16px;border-radius:var(--radius);margin-bottom:24px;font-size:13px;background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.25);color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/guest/dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Dashboard
  </a>
  <div class="card">
    <div class="card-title">Book a Room</div>
    <div class="card-sub">Select dates to confirm availability</div>
    <div class="gold-line"></div>

    <div th:if="${error}" class="alert-err" th:text="${error}"></div>

    <form method="post" action="/reservations/book" onsubmit="return validateDates()">
      <label>Select Room</label>
      <select name="roomId" required>
        <option value="">— Choose a room —</option>
        <option th:each="room : ${rooms}" th:value="${room.roomId}"
          th:text="${room.roomNumber + ' — ' + room.roomType + ' — Rs.' + room.pricePerNight + '/night'}"></option>
      </select>

      <div class="row2">
        <div>
          <label>Check-in Date</label>
          <input type="date" id="checkIn" name="checkIn" th:min="${minDate}" required onchange="calculateNights()"/>
        </div>
        <div>
          <label>Check-out Date</label>
          <input type="date" id="checkOut" name="checkOut" th:min="${minDate}" required onchange="calculateNights()"/>
        </div>
      </div>

      <div class="nights-display" id="nightsDisplay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="20 6 9 17 4 12"/></svg>
        <span id="nightsText"></span>
      </div>

      <label>Number of Guests</label>
      <input type="number" name="numberOfGuests" min="1" max="4" value="1" required/>

      <button class="btn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
        Confirm Booking
      </button>
    </form>
  </div>
</div>
<script>
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  const ts = tomorrow.toISOString().split('T')[0];
  document.getElementById('checkIn').min = ts;
  document.getElementById('checkOut').min = ts;

  function calculateNights(){
    const ci=document.getElementById('checkIn').value;
    const co=document.getElementById('checkOut').value;
    const d=document.getElementById('nightsDisplay');
    const t=document.getElementById('nightsText');
    if(!ci||!co){d.style.display='none';return;}
    const n=Math.round((new Date(co)-new Date(ci))/(86400000));
    d.style.display='flex';
    d.className='nights-display '+(n>0?'nights-ok':'nights-err');
    d.querySelector('svg').style.display=n>0?'block':'none';
    t.textContent=n>0?n+' night'+(n>1?'s':''):'Check-out must be after check-in';
    if(n>0)document.getElementById('checkOut').min=new Date(new Date(ci).getTime()+86400000).toISOString().split('T')[0];
  }
  function validateDates(){
    const ci=new Date(document.getElementById('checkIn').value);
    const co=new Date(document.getElementById('checkOut').value);
    const today=new Date();today.setHours(0,0,0,0);
    if(ci<=today){alert('Check-in date must be after today.');return false;}
    if(co<=ci){alert('Check-out must be after check-in.');return false;}
    return true;
  }
</script>
</body>
</html>
