<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Reservations</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; }
        h2 { color: #2c3e50; }
        .success { color: green; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn-cancel { background: #c0392b; color: white; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8em; }
        .CONFIRMED { background: #d5f5e3; color: #1e8449; }
        .CANCELLED { background: #fadbd8; color: #c0392b; }
        .CHECKED_IN { background: #d6eaf8; color: #1a5276; }
        .CHECKED_OUT { background: #f0f0f0; color: #555; }
        a { color: #2c3e50; }
    </style>
</head>
<body>
    <h2>My Reservations</h2>
    <p th:if="${param.booked}" class="success">Booking confirmed! Reservation ID: <span th:text="${param.booked}"></span></p>
    <table>
        <tr>
            <th>Reservation ID</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Status</th><th>Action</th>
        </tr>
        <tr th:each="res : ${reservations}">
            <td th:text="${res.reservationId}"></td>
            <td th:text="${res.roomId}"></td>
            <td th:text="${res.checkIn}"></td>
            <td th:text="${res.checkOut}"></td>
            <td th:text="${res.nights}"></td>
            <td><span class="badge" th:classappend="${res.status}" th:text="${res.status}"></span></td>
            <td>
                <form th:if="${res.status == 'CONFIRMED'}" method="post" action="/reservations/cancel" style="display:inline">
                    <input type="hidden" name="reservationId" th:value="${res.reservationId}"/>
                    <button class="btn-cancel" type="submit">Cancel</button>
                </form>
            </td>
        </tr>
    </table>
    <br><a href="/guest/dashboard">Back to Dashboard</a>
</body>
</html>
