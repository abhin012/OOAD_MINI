<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Housekeeping — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--text2:#B8B4AE;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--green:#4CAF7C;--amber:#E0A030}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:48px 40px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:40px;transition:color 0.2s}
.back:hover{color:var(--gold)}
.back svg{width:14px;height:14px}
.title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;letter-spacing:0.08em;margin-bottom:32px}
.add-card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:28px;margin-bottom:32px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:8px;min-width:160px}
label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted)}
input,select{padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;border-radius:4px;outline:none;transition:border-color 0.2s}
input:focus,select:focus{border-color:var(--gold)}
select option{background:var(--bg3)}
.btn-add{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;border:none;border-radius:4px;cursor:pointer;transition:background 0.2s;white-space:nowrap}
.btn-add:hover{background:var(--gold-light)}
.btn-add svg{width:14px;height:14px}
.table-wrap{border:1px solid var(--border2);border-radius:4px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--bg3);padding:12px 16px;text-align:left;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border2)}
td{padding:14px 16px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,168,76,0.02);color:var(--text)}
.badge{display:inline-block;padding:3px 10px;border-radius:2px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500}
.b-green{background:rgba(76,175,124,0.1);color:var(--green);border:1px solid rgba(76,175,124,0.2)}
.b-amber{background:rgba(224,160,48,0.1);color:var(--amber);border:1px solid rgba(224,160,48,0.2)}
.btn-done{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.2s;font-weight:500;background:rgba(76,175,124,0.1);color:var(--green);border:1px solid rgba(76,175,124,0.3)}
.btn-done:hover{background:rgba(76,175,124,0.2)}
.btn-done svg{width:13px;height:13px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty svg{width:48px;height:48px;margin:0 auto 16px;display:block;opacity:0.25}
</style>
</head>
<body>
<a class="back" href="/employee/dashboard">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  Dashboard
</a>
<div class="title">Housekeeping Tasks</div>

<div class="add-card">
  <form method="post" action="/employee/housekeeping/add" style="display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;width:100%">
    <div class="field">
      <label>Room Number</label>
      <input type="text" name="roomNumber" placeholder="e.g. 101" required/>
    </div>
    <div class="field">
      <label>Assign To</label>
      <select name="assignedTo" required>
        <option th:each="s : ${staff}" th:value="${s.name}" th:text="${s.name}"></option>
      </select>
    </div>
    <button class="btn-add" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Task
    </button>
  </form>
</div>

<div th:if="${tasks.empty}" class="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  <p>No tasks assigned yet.</p>
</div>

<div class="table-wrap" th:unless="${tasks.empty}">
  <table>
    <thead>
      <tr><th>Task ID</th><th>Room</th><th>Assigned To</th><th>Date</th><th>Status</th><th>Action</th></tr>
    </thead>
    <tbody>
      <tr th:each="task : ${tasks}">
        <td th:text="${task.taskId}" style="color:var(--gold);font-weight:500"></td>
        <td th:text="${task.roomNumber}"></td>
        <td th:text="${task.assignedTo}"></td>
        <td th:text="${task.assignedDate}"></td>
        <td>
          <span th:if="${task.status == 'PENDING'}" class="badge b-amber">Pending</span>
          <span th:if="${task.status == 'COMPLETED'}" class="badge b-green">Completed</span>
        </td>
        <td>
          <form th:if="${task.status == 'PENDING'}" method="post" action="/employee/housekeeping/complete" style="display:inline">
            <input type="hidden" name="taskId" th:value="${task.taskId}"/>
            <button class="btn-done" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              Mark Done
            </button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
