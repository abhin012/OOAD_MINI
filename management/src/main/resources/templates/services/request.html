<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Service Request — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.wrap{width:100%;max-width:460px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:36px;transition:color 0.2s}
.back:hover{color:var(--gold)}
.back svg{width:14px;height:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:40px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:0.08em;margin-bottom:8px}
.card-sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
.gold-line{height:1px;background:linear-gradient(to right,var(--gold),transparent);margin:0 0 32px}
label{display:block;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
select,textarea{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;border-radius:4px;outline:none;transition:border-color 0.2s;margin-bottom:20px}
select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--bg3)}
textarea{resize:vertical;min-height:100px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;border:none;border-radius:4px;cursor:pointer;transition:background 0.2s;margin-top:4px}
.btn:hover{background:var(--gold-light)}
.btn svg{width:15px;height:15px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/guest/dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Dashboard
  </a>
  <div class="card">
    <div class="card-title">Service Request</div>
    <div class="card-sub">We'll attend to your request promptly</div>
    <div class="gold-line"></div>
    <form method="post" action="/services/request">
      <label>Request Type</label>
      <select name="requestType" required>
        <option value="Room Cleaning">Room Cleaning</option>
        <option value="Extra Towels">Extra Towels</option>
        <option value="Room Service">Room Service</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Other">Other</option>
      </select>
      <label>Description (optional)</label>
      <textarea name="description" placeholder="Describe your request..."></textarea>
      <button class="btn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Submit Request
      </button>
    </form>
  </div>
</div>
</body>
</html>
