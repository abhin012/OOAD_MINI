<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Requests — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--text2:#B8B4AE;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--green:#4CAF7C;--amber:#E0A030}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:48px 40px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:40px;transition:color 0.2s}
.back:hover{color:var(--gold)}
.back svg{width:14px;height:14px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;letter-spacing:0.08em}
.btn-new{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;text-decoration:none;border-radius:4px;transition:background 0.2s}
.btn-new:hover{background:var(--gold-light)}
.btn-new svg{width:13px;height:13px}
.alert-ok{padding:14px 18px;border-radius:4px;margin-bottom:24px;font-size:13px;display:flex;align-items:center;gap:10px;background:rgba(76,175,124,0.1);border:1px solid rgba(76,175,124,0.25);color:var(--green)}
.alert-ok svg{width:15px;height:15px;flex-shrink:0}
.table-wrap{border:1px solid var(--border2);border-radius:4px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--bg3);padding:12px 16px;text-align:left;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border2)}
td{padding:14px 16px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,168,76,0.02);color:var(--text)}
.badge{display:inline-block;padding:3px 10px;border-radius:2px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500}
.b-green{background:rgba(76,175,124,0.1);color:var(--green);border:1px solid rgba(76,175,124,0.2)}
.b-amber{background:rgba(224,160,48,0.1);color:var(--amber);border:1px solid rgba(224,160,48,0.2)}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty svg{width:48px;height:48px;margin:0 auto 16px;display:block;opacity:0.25}
.empty a{color:var(--gold);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<a class="back" href="/guest/dashboard">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  Dashboard
</a>

<div class="header">
  <div class="title">My Service Requests</div>
  <a href="/services/request" class="btn-new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New Request
  </a>
</div>

<div th:if="${param.submitted}" class="alert-ok">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  Request submitted — we'll attend to it shortly.
</div>

<div th:if="${requests.empty}" class="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>
  <p style="margin-bottom:16px">No requests yet.</p>
  <a href="/services/request">Submit your first request →</a>
</div>

<div class="table-wrap" th:unless="${requests.empty}">
  <table>
    <thead>
      <tr><th>Request ID</th><th>Type</th><th>Description</th><th>Date</th><th>Status</th></tr>
    </thead>
    <tbody>
      <tr th:each="req : ${requests}">
        <td th:text="${req.requestId}" style="color:var(--gold);font-weight:500"></td>
        <td th:text="${req.requestType}"></td>
        <td th:text="${req.description}"></td>
        <td th:text="${req.requestDate}"></td>
        <td>
          <span th:if="${req.status == 'OPEN'}" class="badge b-amber">Open</span>
          <span th:if="${req.status == 'RESOLVED'}" class="badge b-green">Resolved</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
