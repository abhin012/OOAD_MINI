<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Successful</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5;text-align:center;padding-top:100px;}
        .tick{width:60px;height:60px;background:#1e8449;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:white;font-size:1.8em;}
        h2{color:#1e8449;}
        p{color:#555;}
        .pid{font-size:1.2em;font-weight:bold;color:#2c3e50;}
        a{color:#2c3e50;display:inline-block;margin-top:20px;padding:10px 24px;border:2px solid #2c3e50;border-radius:4px;text-decoration:none;}
    </style>
</head>
<body>
    <div class="tick">✓</div>
    <h2>Payment Successful!</h2>
    <p>Payment ID: <span class="pid" th:text="${paymentId}"></span></p>
    <p>Your booking is confirmed. Thank you!</p>
    <a href="/guest/dashboard">Back to Dashboard</a>
</body>
</html>
