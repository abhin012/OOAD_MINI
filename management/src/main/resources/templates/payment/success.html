<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Payment Successful — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--text:#F0EDE8;--muted:#6A6660;--border:rgba(201,168,76,0.15);--green:#4CAF7C;--radius:4px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(76,175,124,0.06) 0%,transparent 60%);pointer-events:none}
.card{text-align:center;max-width:400px;width:100%}
.check-circle{width:80px;height:80px;background:rgba(76,175,124,0.1);border:1px solid rgba(76,175,124,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;animation:pop 0.5s ease}
.check-circle svg{width:36px;height:36px;color:var(--green)}
@keyframes pop{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
.success-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--text);margin-bottom:8px}
.success-msg{font-size:13px;color:var(--muted);margin-bottom:32px;line-height:1.6}
.pid-box{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:16px 24px;margin-bottom:36px;display:inline-block}
.pid-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pid-value{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--gold);letter-spacing:0.1em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;border-radius:4px;transition:all 0.2s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn svg{width:14px;height:14px}
</style>
</head>
<body>
<div class="card">
  <div class="check-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div class="success-title">Payment Confirmed</div>
  <div class="success-msg">Your booking at VAKA Hotel has been successfully confirmed. We look forward to welcoming you.</div>
  <div class="pid-box">
    <div class="pid-label">Payment Reference</div>
    <div class="pid-value" th:text="${paymentId}"></div>
  </div>
  <br>
  <a href="/guest/dashboard" class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Back to Dashboard
  </a>
</div>
</body>
</html>
