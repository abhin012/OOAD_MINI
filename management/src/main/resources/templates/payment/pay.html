<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Make Payment — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--radius:4px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:48px;width:100%;max-width:420px;text-align:center}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:0.35em;color:var(--gold);margin-bottom:6px}
.inv-id{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.amount{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:var(--text);margin-bottom:8px}
.amount-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
.gold-line{height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:0 0 32px}
label{display:block;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;text-align:left}
select{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;border-radius:4px;outline:none;transition:border-color 0.2s;margin-bottom:24px}
select:focus{border-color:var(--gold)}
select option{background:var(--bg3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;border:none;border-radius:4px;cursor:pointer;transition:background 0.2s}
.btn:hover{background:var(--gold-light)}
.btn svg{width:15px;height:15px}
.cancel{display:block;text-align:center;font-size:12px;color:var(--muted);text-decoration:none;margin-top:20px;transition:color 0.2s}
.cancel:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VAKA</div>
  <div class="inv-id" th:text="${invoice.invoiceId}"></div>
  <div class="amount" th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.totalAmount,1,2)}"></div>
  <div class="amount-label">Total Amount Due</div>
  <div class="gold-line"></div>
  <form method="post" action="/payments/pay">
    <input type="hidden" name="invoiceId" th:value="${invoice.invoiceId}"/>
    <label>Payment Method</label>
    <select name="method" required>
      <option value="CASH">Cash</option>
      <option value="CREDIT_CARD">Credit Card</option>
      <option value="DEBIT_CARD">Debit Card</option>
      <option value="UPI">UPI</option>
      <option value="WALLET">Wallet</option>
    </select>
    <button class="btn" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Confirm Payment
    </button>
  </form>
  <a href="/reservations/my" class="cancel">← Cancel</a>
</div>
</body>
</html>
