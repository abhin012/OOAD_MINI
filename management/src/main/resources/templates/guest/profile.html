<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        .field { margin: 12px 0; }
        .label { color: #888; font-size: 0.85em; }
        .value { font-size: 1em; color: #2c3e50; font-weight: bold; }
        a { color: #2c3e50; }
    </style>
</head>
<body>
<div class="card">
    <h2>My Profile</h2>
    <div class="field"><div class="label">Guest ID</div><div class="value" th:text="${guest.guestId}"></div></div>
    <div class="field"><div class="label">Full Name</div><div class="value" th:text="${guest.fullName}"></div></div>
    <div class="field"><div class="label">Email</div><div class="value" th:text="${guest.email}"></div></div>
    <div class="field"><div class="label">Phone</div><div class="value" th:text="${guest.phone}"></div></div>
    <div class="field"><div class="label">ID Proof</div><div class="value" th:text="${guest.idProof}"></div></div>
    <br>
    <a href="/guest/dashboard">Back to Dashboard</a>
</div>
</body>
</html>
