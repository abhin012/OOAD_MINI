<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Dashboard — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,0.12);--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--text2:#B8B4AE;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:0.35em;color:var(--gold);text-decoration:none}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-name{font-size:12px;color:var(--muted)}
.nav-logout{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 16px;border:1px solid var(--border2);border-radius:2px;transition:all 0.2s}
.nav-logout:hover{color:#E05555;border-color:rgba(224,85,85,0.3)}
.page{padding:48px 40px;max-width:1100px;margin:0 auto}
.greeting-line{width:40px;height:1px;background:var(--gold);margin-bottom:16px}
.greeting{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--text);margin-bottom:6px}
.greeting-sub{font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:48px}
.section-label{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.menu-card{background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:28px 20px;text-align:center;text-decoration:none;color:var(--text2);transition:all 0.25s;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.menu-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,0.05) 0%,transparent 70%);opacity:0;transition:opacity 0.25s}
.menu-card:hover{background:var(--bg3);border-color:var(--gold);color:var(--text);transform:translateY(-3px)}
.menu-card:hover::before{opacity:1}
.menu-card svg{width:26px;height:26px;color:var(--gold)}
.menu-card span{font-size:11px;letter-spacing:0.15em;text-transform:uppercase}
</style>
</head>
<body>
<nav class="navbar">
  <a class="brand" href="/guest/dashboard">VAKA</a>
  <div class="nav-right">
    <span class="nav-name" th:text="${guest.fullName}"></span>
    <a class="nav-logout" href="/guest/logout">Sign Out</a>
  </div>
</nav>
<div class="page">
  <div class="greeting-line"></div>
  <div class="greeting">Welcome back, <span th:text="${guest.firstName}" style="color:var(--gold)"></span></div>
  <div class="greeting-sub">Guest ID: <span th:text="${guest.guestId}"></span></div>
  <div class="section-label">Quick Access</div>
  <div class="menu-grid">
    <a href="/rooms/available" class="menu-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>View Rooms</span></a>
    <a href="/reservations/book" class="menu-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg><span>Book a Room</span></a>
    <a href="/reservations/my" class="menu-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>My Reservations</span></a>
    <a href="/payments/my" class="menu-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span>My Payments</span></a>
    <a href="/services/request" class="menu-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg><span>Service Request</span></a>
    <a href="/guest/profile" class="menu-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>My Profile</span></a>
  </div>
</div>
</body>
</html>
