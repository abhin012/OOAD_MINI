<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Register — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--red:#E05555}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(201,168,76,0.05) 0%,transparent 60%);pointer-events:none}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:48px;width:100%;max-width:460px}
.logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;letter-spacing:0.35em;color:var(--gold);text-align:center;margin-bottom:6px}
.sub{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:40px}
.gold-line{height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:0 0 36px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;border-radius:4px;outline:none;transition:border-color 0.2s;margin-bottom:20px}
input:focus{border-color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--gold);color:#0A0A0A;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;border:none;border-radius:4px;cursor:pointer;transition:background 0.2s;margin-top:4px}
.btn:hover{background:var(--gold-light)}
.btn svg{width:15px;height:15px}
.alert-err{padding:12px 16px;border-radius:4px;margin-bottom:24px;font-size:13px;background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.25);color:var(--red)}
.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
.footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VAKA</div>
  <div class="sub">Create Your Account</div>
  <div class="gold-line"></div>
  <div th:if="${error}" class="alert-err" th:text="${error}"></div>
  <form method="post" action="/guest/register">
    <div class="row2">
      <div><label>First Name</label><input type="text" name="firstName"  required/></div>
      <div><label>Last Name</label><input type="text" name="lastName" required/></div>
    </div>
    <label>Email Address</label>
    <input type="email" name="email"  required/>
    <label>Phone Number</label>
    <input type="text" name="phone" required/>
    <label>ID Proof Number</label>
    <input type="text" name="idProof"  required/>
    <button class="btn" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Create Account
    </button>
  </form>
  <div class="footer">Already registered? <a href="/guest/login">Sign in</a><br><br><a href="/">← Back to home</a></div>
</div>
</body>
</html>
