<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Guests</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5;padding:40px;}
        h2{color:#2c3e50;}
        table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        th{background:#2c3e50;color:white;padding:12px;text-align:left;}
        td{padding:12px;border-bottom:1px solid #eee;}
        a{color:#2c3e50;}
    </style>
</head>
<body>
    <h2>All Guests</h2>
    <table>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>ID Proof</th></tr>
        <tr th:each="g : ${guests}">
            <td th:text="${g.guestId}"></td>
            <td th:text="${g.fullName}"></td>
            <td th:text="${g.email}"></td>
            <td th:text="${g.phone}"></td>
            <td th:text="${g.idProof}"></td>
        </tr>
    </table>
    <br><a href="/employee/dashboard">Back to Dashboard</a>
</body>
</html>
