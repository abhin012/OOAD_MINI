<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Dashboard</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5;padding:40px;}
        .header{background:#2c3e50;color:white;padding:20px 30px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
        .stats{display:flex;gap:20px;margin-top:24px;flex-wrap:wrap;}
        .stat{background:white;padding:24px 30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center;min-width:140px;}
        .stat .num{font-size:2.2em;font-weight:bold;color:#2c3e50;}
        .stat .lbl{font-size:0.85em;color:#888;margin-top:4px;}
        .menu{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap;}
        .menu a{background:white;padding:20px 24px;border-radius:8px;text-decoration:none;color:#2c3e50;box-shadow:0 2px 8px rgba(0,0,0,0.1);font-weight:bold;}
        .menu a:hover{background:#2c3e50;color:white;}
        a.logout{color:white;font-size:0.9em;}
    </style>
</head>
<body>
<div class="header">
    <div>
        <h2 th:text="'Welcome, ' + ${employee.name}"></h2>
        <span th:text="${employee.role}"></span>
    </div>
    <a class="logout" href="/employee/logout">Logout</a>
</div>
<div class="stats">
    <div class="stat"><div class="num" th:text="${totalGuests}"></div><div class="lbl">Total Guests</div></div>
    <div class="stat"><div class="num" th:text="${totalReservations}"></div><div class="lbl">Reservations</div></div>
    <div class="stat"><div class="num" th:text="${availableRooms}"></div><div class="lbl">Available Rooms</div></div>
</div>
<div class="menu">
    <a href="/employee/reservations">Reservations</a>
    <a href="/employee/guests">All Guests</a>
    <a href="/employee/payments">Payments</a>
    <a href="/employee/services">Service Requests</a>
    <a href="/employee/housekeeping">Housekeeping</a>
</div>
</body>
</html>
