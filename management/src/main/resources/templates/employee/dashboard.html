<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Staff Dashboard — VAKA Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,0.1);--bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--text:#F0EDE8;--text2:#B8B4AE;--muted:#6A6660;--border:rgba(201,168,76,0.15);--border2:rgba(240,237,232,0.08);--radius:4px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:0.35em;color:var(--gold);text-decoration:none}
.nav-info{display:flex;align-items:center;gap:16px}
.nav-name{font-size:12px;color:var(--text2)}
.nav-role{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;padding:3px 10px;background:var(--gold-dim);border:1px solid var(--border);color:var(--gold);border-radius:2px}
.nav-logout{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 14px;border:1px solid var(--border2);border-radius:2px;transition:all 0.2s;margin-left:8px}
.nav-logout:hover{color:#E05555;border-color:rgba(224,85,85,0.3)}
.page{padding:48px 40px;max-width:1100px;margin:0 auto}
.greeting-line{width:40px;height:1px;background:var(--gold);margin-bottom:16px}
.greeting{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;color:var(--text);margin-bottom:40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:48px}
.stat{background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:28px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(to right,var(--gold),transparent)}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);line-height:1;margin-bottom:8px}
.stat-lbl{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)}
.section-label{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}
.menu-card{background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:28px 20px;text-align:center;text-decoration:none;color:var(--text2);transition:all 0.25s;display:flex;flex-direction:column;align-items:center;gap:14px}
.menu-card svg{width:24px;height:24px;color:var(--gold)}
.menu-card span{font-size:11px;letter-spacing:0.15em;text-transform:uppercase}
.menu-card:hover{background:var(--bg3);border-color:var(--gold);color:var(--text);transform:translateY(-2px)}
</style>
</head>
<body>
<nav class="navbar">
  <a class="brand" href="/employee/dashboard">VAKA</a>
  <div class="nav-info">
    <span class="nav-name" th:text="${employee.name}"></span>
    <span class="nav-role" th:text="${employee.role}"></span>
    <a class="nav-logout" href="/employee/logout">Sign Out</a>
  </div>
</nav>

<div class="page">
  <div class="greeting-line"></div>
  <div class="greeting">Staff Dashboard</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" th:text="${totalGuests}"></div>
      <div class="stat-lbl">Total Guests</div>
    </div>
    <div class="stat">
      <div class="stat-num" th:text="${totalReservations}"></div>
      <div class="stat-lbl">Reservations</div>
    </div>
    <div class="stat">
      <div class="stat-num" th:text="${availableRooms}"></div>
      <div class="stat-lbl">Available Rooms</div>
    </div>
  </div>

  <div class="section-label">Operations</div>
  <div class="menu-grid">
    <a href="/employee/reservations" class="menu-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
      <span>Reservations</span>
    </a>
    <a href="/employee/guests" class="menu-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>All Guests</span>
    </a>
    <a href="/employee/payments" class="menu-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <span>Payments</span>
    </a>
    <a href="/employee/services" class="menu-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      <span>Service Requests</span>
    </a>
    <a href="/employee/housekeeping" class="menu-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Housekeeping</span>
    </a>
  </div>
</div>
</body>
</html>
