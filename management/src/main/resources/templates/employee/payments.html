!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Payments</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5;padding:40px;}
        h2{color:#2c3e50;}
        table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        th{background:#2c3e50;color:white;padding:12px;text-align:left;}
        td{padding:12px;border-bottom:1px solid #eee;}
        .paid{background:#d5f5e3;color:#1e8449;padding:4px 10px;border-radius:12px;font-size:0.85em;}
        .unpaid{background:#fadbd8;color:#c0392b;padding:4px 10px;border-radius:12px;font-size:0.85em;}
        a{color:#2c3e50;}
    </style>
</head>
<body>
    <h2>All Invoices and Payments</h2>
    <table>
        <tr><th>Invoice ID</th><th>Reservation</th><th>Subtotal</th><th>Tax</th><th>Total</th><th>Date</th><th>Status</th></tr>
        <tr th:each="inv : ${invoices}">
            <td th:text="${inv.invoiceId}"></td>
            <td th:text="${inv.reservationId}"></td>
            <td th:text="'Rs. ' + ${#numbers.formatDecimal(inv.subtotal,1,2)}"></td>
            <td th:text="'Rs. ' + ${#numbers.formatDecimal(inv.taxAmount,1,2)}"></td>
            <td th:text="'Rs. ' + ${#numbers.formatDecimal(inv.totalAmount,1,2)}"></td>
            <td th:text="${inv.issueDate}"></td>
            <td>
                <span th:if="${inv.paid}" class="paid">PAID</span>
                <span th:unless="${inv.paid}" class="unpaid">UNPAID</span>
            </td>
        </tr>
    </table>
    <br><a href="/employee/dashboard">Back to Dashboard</a>
</body>
</html>
